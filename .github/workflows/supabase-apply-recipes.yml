name: Apply recipes migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false

jobs:
  apply-recipes:
    name: Apply the versioned recipes migration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing GitHub repository secret SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing GitHub repository secret SUPABASE_DB_PASSWORD" && exit 1)
          supabase link --project-ref ebtdksftgrtfwikpmzqt --password "$SUPABASE_DB_PASSWORD"

      - name: Verify baseline is registered and recipes migration is pending
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -f supabase/migrations/20261012000000_remote_schema_baseline.sql
          test -f supabase/migrations/20261013090000_create_recipes.sql
          supabase migration list --linked | tee /tmp/migrations.txt
          grep -E '20261012000000.*20261012000000' /tmp/migrations.txt >/dev/null || {
            echo "Safety stop: baseline 20261012000000 is not registered as applied remotely."
            exit 1
          }
          awk -F'|' '$1 ~ /20261013090000/ && $2 !~ /20261013090000/ {pending=1} END {exit !pending}' /tmp/migrations.txt || {
            echo "Safety stop: recipes migration is not listed as pending. Review migration history before proceeding."
            exit 1
          }

      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked

      - name: Verify recipes migration is registered as applied
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase migration list --linked | tee /tmp/migrations-after.txt
          grep -E '20261013090000.*20261013090000' /tmp/migrations-after.txt >/dev/null || {
            echo "Verification failed: recipes migration is not registered as applied."
            exit 1
          }
