name: Supabase schema baseline review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-schema-baseline-review
  cancel-in-progress: false

jobs:
  snapshot:
    name: Export current public schema for review
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Connect to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing SUPABASE_DB_PASSWORD" && exit 1)
          supabase link --project-ref ebtdksftgrtfwikpmzqt --password "$SUPABASE_DB_PASSWORD"

      - name: Export current schema (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db dump --linked --schema public --file remote_schema_baseline.sql
          printf '\n-- BASELINE ONLY: this file describes the pre-existing remote schema.\n-- Do not apply it to the existing project with db push.\n-- Review and register its version as already applied before applying later migrations.\n' >> remote_schema_baseline.sql

      - name: Upload schema snapshot
        uses: actions/upload-artifact@v4
        with:
          name: supabase-public-schema-baseline
          path: remote_schema_baseline.sql
          if-no-files-found: error
          retention-days: 7
