name: Supabase schema baseline review

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: supabase-schema-baseline-review
  cancel-in-progress: false

jobs:
  snapshot:
    name: Export current schema and open review PR
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Connect to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing SUPABASE_DB_PASSWORD" && exit 1)
          supabase link --project-ref ebtdksftgrtfwikpmzqt --password "$SUPABASE_DB_PASSWORD"

      - name: Export current schema as a baseline migration (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          mkdir -p supabase/migrations
          supabase db dump --linked --schema public --file supabase/migrations/20261012000000_remote_schema_baseline.sql
          # The public-schema dump does not include the trigger attached to auth.users.
          # Recreate that behavior for a fresh project; this baseline will be marked applied, not executed, on the existing project.
          cat >> supabase/migrations/20261012000000_remote_schema_baseline.sql <<'SQL'

          -- Recreate the auth trigger that provisions a profile for each new user.
          DROP TRIGGER IF EXISTS on_auth_user_created ON auth.users;
          CREATE TRIGGER on_auth_user_created
            AFTER INSERT ON auth.users
            FOR EACH ROW EXECUTE FUNCTION public.handle_new_user();

          -- BASELINE ONLY: describes the schema that already exists remotely.
          -- NEVER execute this migration against the existing project with db push.
          -- After review/merge, register version 20261012000000 as already applied with migration repair.
          SQL

      - name: Upload schema snapshot
        uses: actions/upload-artifact@v4
        with:
          name: supabase-public-schema-baseline
          path: supabase/migrations/20261012000000_remote_schema_baseline.sql
          if-no-files-found: error
          retention-days: 7

      - name: Create pull request for review
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/supabase-schema-baseline
          delete-branch: true
          title: "chore(db): add existing Supabase schema baseline"
          commit-message: "chore(db): add existing Supabase schema baseline"
          body: |
            ## Purpose
            Capture the existing Supabase public schema in version control as a baseline.

            ## Important safety notes
            - This file represents schema that already exists in the remote project.
            - Do not apply it to the current project with `supabase db push`.
            - Review the SQL carefully, including functions, policies, and dependencies.
            - After merge, register version `20261012000000` as already applied before applying the pending recipes migration.
            - This snapshot covers the `public` schema; the auth.users trigger and other non-public objects must be checked separately.
          add-paths: |
            supabase/migrations/20261012000000_remote_schema_baseline.sql
