name: Clean unpublished recipe data

on:
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: "Aplica la limpieza conservadora SOLO a recetas no publicadas"
        required: true
        type: choice
        options:
          - NO
          - APPLY
        default: NO

permissions:
  contents: read

concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false

jobs:
  clean:
    if: inputs.confirm_apply == 'APPLY'
    name: Verify and clean unpublished recipes
    runs-on: ubuntu-latest
    steps:
      - name: Check out main with the reviewed cleanup migration
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing repository secret SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing repository secret SUPABASE_DB_PASSWORD" && exit 1)
          supabase link --project-ref ebtdksftgrtfwikpmzqt --password "$SUPABASE_DB_PASSWORD"

      - name: Verify migration history before applying cleanup
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase migration list --linked | tee /tmp/migrations-before.txt
          if ! grep -E '20261014120000.*\|.*\|' /tmp/migrations-before.txt >/dev/null; then
            echo "Safety stop: migration 20261014120000 is not present in the migration history."
            exit 1
          fi

      - name: Apply reviewed cleanup migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked

      - name: Verify cleanup migration was applied
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase migration list --linked | tee /tmp/migrations-after.txt
          grep -E '20261014120000.*20261014120000' /tmp/migrations-after.txt >/dev/null
