name: Apply selected Supabase migration

on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: "Ruta exacta del archivo SQL, p. ej. supabase/migrations/20261019120000_import_singularis_catalog.sql"
        required: true
        type: string
      confirm_apply:
        description: "Escribe APPLY para confirmar la ejecución"
        required: true
        type: choice
        options:
          - NO
          - APPLY
        default: NO

permissions:
  contents: read

concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false

jobs:
  apply-selected-migration:
    if: inputs.confirm_apply == 'APPLY'
    name: Validate and apply one selected migration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate selected SQL file
        id: selected
        env:
          MIGRATION_FILE: ${{ inputs.migration_file }}
        run: |
          set -euo pipefail
          if [[ "$MIGRATION_FILE" != supabase/migrations/*.sql ]]; then
            echo "Safety stop: the file must be inside supabase/migrations and end in .sql."
            exit 1
          fi
          if [[ "$MIGRATION_FILE" == *".."* || "$MIGRATION_FILE" == *$'\n'* ]]; then
            echo "Safety stop: invalid path."
            exit 1
          fi
          if [[ ! "$MIGRATION_FILE" =~ ^supabase/migrations/[0-9]{14}_[A-Za-z0-9_-]+\.sql$ ]]; then
            echo "Safety stop: expected a timestamped migration filename, e.g. 20261019120000_import_catalog.sql."
            exit 1
          fi
          if [[ ! -f "$MIGRATION_FILE" ]]; then
            echo "Safety stop: file does not exist on the selected branch: $MIGRATION_FILE"
            exit 1
          fi
          VERSION="$(basename "$MIGRATION_FILE" | cut -d_ -f1)"
          echo "file=$MIGRATION_FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Selected migration: $MIGRATION_FILE ($VERSION)"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing repository secret SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing repository secret SUPABASE_DB_PASSWORD" && exit 1)
          supabase link --project-ref ebtdksftgrtfwikpmzqt --password "$SUPABASE_DB_PASSWORD"

      - name: Verify selected migration is the only pending migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SELECTED_VERSION: ${{ steps.selected.outputs.version }}
        run: |
          set -euo pipefail
          supabase migration list --linked | tee /tmp/migrations-before.txt

          if grep -E "$SELECTED_VERSION[[:space:]]*\\|[[:space:]]*$SELECTED_VERSION" /tmp/migrations-before.txt >/dev/null; then
            echo "Safety stop: selected migration $SELECTED_VERSION is already registered as applied."
            exit 1
          fi

          PENDING="$(awk -F'|' 'NR > 2 { local_version=$1; remote_version=$2; gsub(/[^0-9]/, "", local_version); gsub(/[^0-9]/, "", remote_version); if (length(local_version) == 14 && remote_version == "") print local_version }' /tmp/migrations-before.txt | sort)"
          EXPECTED="$SELECTED_VERSION"
          if [ "$PENDING" != "$EXPECTED" ]; then
            echo "Safety stop: Supabase CLI applies all pending migrations, not an individual file."
            echo "This workflow only proceeds when the selected migration is the sole pending migration."
            echo "Selected: $EXPECTED"
            echo "Pending migrations detected:"
            printf '%s\n' "$PENDING"
            exit 1
          fi

      - name: Apply migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked

      - name: Verify selected migration is applied
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SELECTED_VERSION: ${{ steps.selected.outputs.version }}
        run: |
          set -euo pipefail
          supabase migration list --linked | tee /tmp/migrations-after.txt
          grep -E "$SELECTED_VERSION.*$SELECTED_VERSION" /tmp/migrations-after.txt >/dev/null || {
            echo "Verification failed: migration $SELECTED_VERSION is not registered as applied."
            exit 1
          }
