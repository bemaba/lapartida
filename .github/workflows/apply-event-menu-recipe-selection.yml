name: Apply event-specific menu selections migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-event-menu-recipe-selection.yml
      - supabase/migrations/20261019170000_event_menu_recipe_selection.sql

permissions:
  contents: read

concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply and verify event menu selections
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate selected migration
        run: |
          set -euo pipefail
          test -f supabase/migrations/20261019170000_event_menu_recipe_selection.sql

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing SUPABASE_DB_PASSWORD" && exit 1)
          supabase link --project-ref ebtdksftgrtfwikpmzqt --password "$SUPABASE_DB_PASSWORD"

      - name: Confirm only the selected migration is pending
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase migration list --linked | tee /tmp/migrations-before.txt
          PENDING="$(awk -F'|' 'NR > 2 {
            local_version=$1; remote_version=$2
            gsub(/[^0-9]/, "", local_version)
            gsub(/[^0-9]/, "", remote_version)
            if (length(local_version) == 14 && remote_version == "") print local_version
          }' /tmp/migrations-before.txt | sort)"
          EXPECTED_ONLY="$(printf '%s\n' 20261019170000)"
          EXPECTED_BOTH="$(printf '%s\n' 20261019160000 20261019170000 | sort)"
          if [ "$PENDING" != "$EXPECTED_ONLY" ] && [ "$PENDING" != "$EXPECTED_BOTH" ]; then
            echo "Safety stop: only the event-menu conversion (20261019160000) and the selected-recipes migration (20261019170000) may be pending."
            echo "Detected pending versions:"
            printf '%s\n' "$PENDING"
            exit 1
          fi

      - name: Apply migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked

      - name: Verify migration is applied
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase migration list --linked | tee /tmp/migrations-after.txt
          grep -E '20261019170000.*20261019170000' /tmp/migrations-after.txt >/dev/null || {
            echo "Verification failed: selected migration is not registered as applied."
            exit 1
          }
