name: Import Una fuerza del pasado recipes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false

jobs:
  import-recipes:
    name: Import two themed recipes as drafts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing GitHub repository secret SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing GitHub repository secret SUPABASE_DB_PASSWORD" && exit 1)
          supabase link --project-ref ebtdksftgrtfwikpmzqt --password "$SUPABASE_DB_PASSWORD"

      - name: Verify baseline and existing recipe migrations are applied
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase migration list --linked | tee /tmp/migrations.txt
          for version in 20261012000000 20261013090000 20261013150000; do
            grep -E "$version.*$version" /tmp/migrations.txt >/dev/null || {
              echo "Safety stop: required migration $version is not registered as applied."
              exit 1
            }
          done

      - name: Verify recipe import migration is pending
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -f supabase/migrations/20261013170000_import_una_fuerza_del_pasado_recipes.sql
          supabase migration list --linked | tee /tmp/migrations-before.txt
          awk -F'|' '$1 ~ /20261013170000/ && $2 !~ /20261013170000/ {pending=1} END {exit !pending}' /tmp/migrations-before.txt || {
            echo "Safety stop: import migration is not pending. It may already have been applied."
            exit 1
          }

      - name: Apply the reviewed recipe import
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked

      - name: Verify recipe import migration is applied
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase migration list --linked | tee /tmp/migrations-after.txt
          grep -E '20261013170000.*20261013170000' /tmp/migrations-after.txt >/dev/null || {
            echo "Verification failed: recipe import migration is not registered as applied."
            exit 1
          }
