name: Cleanup test users and timekeeping data

on:
  workflow_dispatch:
    inputs:
      confirm_cleanup:
        description: "Confirmación obligatoria para eliminar cuentas y datos de prueba"
        required: true
        type: choice
        options:
          - "NO EJECUTAR"
          - "ELIMINAR USUARIOS Y FICHAJES"
        default: "NO EJECUTAR"

permissions:
  contents: read

concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false

jobs:
  cleanup:
    name: Preserve two accounts and clean test data
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM_CLEANUP: ${{ inputs.confirm_cleanup }}
        run: |
          if [ "$CONFIRM_CLEANUP" != "ELIMINAR USUARIOS Y FICHAJES" ]; then
            echo "Safety stop: no se ha elegido la confirmación exacta. No se ha cambiado nada."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing GitHub repository secret SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing GitHub repository secret SUPABASE_DB_PASSWORD" && exit 1)
          supabase link --project-ref ebtdksftgrtfwikpmzqt --password "$SUPABASE_DB_PASSWORD"

      - name: Verify required migrations and cleanup is pending
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -f supabase/migrations/20261013180000_cleanup_test_users_keep_admin_and_chef.sql
          supabase migration list --linked | tee /tmp/migrations.txt
          for version in 20261012000000 20261013090000 20261013150000; do
            grep -E "$version.*$version" /tmp/migrations.txt >/dev/null || {
              echo "Safety stop: required migration $version is not registered as applied."
              exit 1
            }
          done
          awk -F'|' '$1 ~ /20261013180000/ && $2 !~ /20261013180000/ {pending=1} END {exit !pending}' /tmp/migrations.txt || {
            echo "Safety stop: cleanup migration is not pending; it may already have run."
            exit 1
          }

      - name: Apply cleanup and any earlier pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Supabase db push applies pending migrations in version order. If the themed recipe import (20261013170000) is still pending, it will run before the cleanup."
          supabase db push --linked

      - name: Verify migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase migration list --linked | tee /tmp/migrations-after.txt
          grep -E '20261013180000.*20261013180000' /tmp/migrations-after.txt >/dev/null || {
            echo "Verification failed: cleanup migration is not registered as applied."
            exit 1
          }
